<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rocket Shooter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="score-board" class="ui-element">Score: <span id="score">0</span></div>
        <div id="lives-board" class="ui-element" style="bottom: 25px; left: 30px;">Hearts: <span id="lives">♥♥♥</span></div>
        
        <div id="start-screen" class="screen">
            <h1>Rocket Shooter</h1>
            <p>Move mouse to fly. <br> Spacebar for Super Eraser (costs 500 points)!</p>
            <button class="btn" id="start-btn">Launch Rocket!</button>
        </div>

        <div id="game-over-screen" class="screen hidden">
            <h1>Crashed!</h1>
            <button class="btn" id="restart-btn">Try Again</button>
        </div>
<div id="game-over-screen" class="screen hidden">
    <h1>Crashed!</h1>
    <p>The ink monsters took over.</p>
    <button class="btn" id="restart-btn">Play Again!</button>
</div>
        <canvas id="gameCanvas" width="1024" height="768"></canvas>
    </div>
    <script src="script.js"></script>
</body>
</html>
